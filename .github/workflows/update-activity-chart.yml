name: Update activity chart

on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate activity chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/activity_chart.py

      - name: Save chart when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-chart.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update activity chart"
          git push
